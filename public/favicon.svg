<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Modern rounded squircle background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#059669" />
  
  <!-- Subtle gloss/gradient overlay -->
  <defs>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#icon-grad)" />

  <!-- White Chef Hat Silhouette -->
  <!-- Left Puff, Center Puff, Right Puff, Base -->
  <path d="M256,110 C195,110 175,155 175,180 C140,180 130,225 165,260 C140,285 155,330 190,340 L190,370 L322,370 L322,340 C357,330 372,285 347,260 C382,225 372,180 337,180 C337,155 317,110 256,110 Z" fill="#ffffff" />
  
  <!-- Hat Bottom Band -->
  <rect x="195" y="380" width="122" height="26" rx="8" fill="#ffffff" />
  
  <!-- Flat Design Negative Space Analytics/Growth Bars (creates a stencil cut-out inside the hat) -->
  <g fill="#059669">
    <!-- Analytical intelligence bar 1 -->
    <rect x="214" y="275" width="20" height="50" rx="4" />
    <!-- Analytical intelligence bar 2 -->
    <rect x="246" y="235" width="20" height="90" rx="4" />
    <!-- Analytical intelligence bar 3 -->
    <rect x="278" y="195" width="20" height="130" rx="4" />
  </g>
</svg>
